# 零一云 (TokenHub) Nginx 配置 - 01tokenhub.cn
# 443 HTTPS 主入口 + 8080 HTTP 兜底 + 80 跳转 HTTPS

# 80 端口：跳转 HTTPS（备案后可用；未备案时此端口被阿里云拦截，不影响 443/8080）
server {
    listen 80;
    server_name 01tokenhub.cn;
    return 301 https://$host$request_uri;
}

# 8080 端口：HTTP 兜底（未备案域名无法用 80/443 时可访问 http://01tokenhub.cn:8080）
server {
    listen 8080;
    server_name 01tokenhub.cn;

    client_max_body_size 256m;
    access_log /var/log/nginx/tokenhub.access.log;
    error_log  /var/log/nginx/tokenhub.error.log;

    location / {
        proxy_pass http://127.0.0.1:4340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# 443 端口：HTTPS 主入口
server {
    listen 443 ssl;
    server_name 01tokenhub.cn;

    # SSL 证书（上传证书文件到 /etc/nginx/ssl/ 并改成你的文件名）
    ssl_certificate     /etc/nginx/ssl/01tokenhub.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/01tokenhub.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 256m;
    access_log /var/log/nginx/tokenhub.access.log;
    error_log  /var/log/nginx/tokenhub.error.log;

    # ---------- 后端 API 反代 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:4340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /mj/ {
        proxy_pass http://127.0.0.1:4340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /pg/ {
        proxy_pass http://127.0.0.1:4340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:4340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /v1beta/ {
        proxy_pass http://127.0.0.1:4340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /suno/ {
        proxy_pass http://127.0.0.1:4340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SSE 流式响应：关闭缓冲
    location ~ ^/(api|mj|pg)/.*(chat/completions|completions|embeddings|generate|images) {
        proxy_pass http://127.0.0.1:4340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- 前端静态文件 ----------
    location / {
        root /web/01tokenhub;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        root /web/01tokenhub;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        deny all;
    }
}
