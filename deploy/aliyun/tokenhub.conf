# ============================================================
# 零一云 (TokenHub) Nginx 配置（前后端分离部署）
# 说明：
#   - 前端静态文件位于 /web/01tokenhub/new-api
#   - 后端 API 服务监听 127.0.0.1:4340
#   - /api /mj /pg /v1 /v1beta /suno 前缀请求反向代理到后端
# 使用前必改：
#   1. 将 server_name 后的 your-domain.com 换成你的真实域名
#   2. 阿里云安全组放行 8080 端口（未备案域名无法用 80 端口）
# 安装方式：
#   cp tokenhub.conf /etc/nginx/conf.d/
#   nginx -t && systemctl reload nginx
# ============================================================

server {
    # 未备案域名方案：用 8080 端口（备案完成后可改为 listen 80）
    listen 8080;
    # 改成你的真实域名；也可保留 IP 访问
    server_name your-domain.com;

    # 上传文件大小限制（素材库上传：图片 30MB / 视频 200MB / 音频 15MB）
    client_max_body_size 256m;

    # 访问日志与错误日志
    access_log /var/log/nginx/tokenhub.access.log;
    error_log  /var/log/nginx/tokenhub.error.log;

    # ---------- 后端 API 反向代理 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:4340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Midjourney 代理
    location /mj/ {
        proxy_pass http://127.0.0.1:4340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 其他 OpenAI 兼容接口（/pg 为 Proxy Gateway 前缀）
    location /pg/ {
        proxy_pass http://127.0.0.1:4340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # OpenAI 兼容转发接口（/v1 对外 API，如 /v1/chat/completions）
    location /v1/ {
        proxy_pass http://127.0.0.1:4340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Gemini 兼容接口
    location /v1beta/ {
        proxy_pass http://127.0.0.1:4340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Suno 等视频/音频生成接口
    location /suno/ {
        proxy_pass http://127.0.0.1:4340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SSE 流式响应：关闭缓冲
    location ~ ^/(api|mj|pg)/.*(chat/completions|completions|embeddings|generate|images) {
        proxy_pass http://127.0.0.1:4340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- 前端静态文件 ----------
    location / {
        root /web/01tokenhub/new-api;
        index index.html;
        # 单页应用路由回退
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（带 hash 的构建产物）
    location /static/ {
        root /web/01tokenhub/new-api;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}
