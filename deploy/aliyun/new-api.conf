# ============================================================
# new-api Nginx 配置（前后端分离部署）
# 说明：
#   - 前端静态文件位于 /opt/new-api/web/dist
#   - 后端 API 服务监听 127.0.0.1:4340
#   - /api /mj /pg 前缀请求反向代理到后端
# 安装方式：
#   sudo cp new-api.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
# 注意：将 server_name 替换为你的域名或服务器 IP
# ============================================================

server {
    listen 80;
    # 改成你的域名，例如 api.example.com；无域名用 _ 或服务器 IP
    server_name _;

    # 上传文件大小限制（素材库上传：图片 30MB / 视频 200MB / 音频 15MB）
    client_max_body_size 256m;

    # 访问日志与错误日志
    access_log /var/log/nginx/new-api.access.log;
    error_log  /var/log/nginx/new-api.error.log;

    # ---------- 后端 API 反向代理 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:4340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Midjourney 代理
    location /mj/ {
        proxy_pass http://127.0.0.1:4340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 其他 OpenAI 兼容接口（/pg 为 Proxy Gateway 前缀）
    location /pg/ {
        proxy_pass http://127.0.0.1:4340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # OpenAI 兼容转发接口（/v1 对外 API，如 /v1/chat/completions）
    location /v1/ {
        proxy_pass http://127.0.0.1:4340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Gemini 兼容接口
    location /v1beta/ {
        proxy_pass http://127.0.0.1:4340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Suno 等视频/音频生成接口
    location /suno/ {
        proxy_pass http://127.0.0.1:4340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SSE 流式响应：关闭缓冲
    location ~ ^/(api|mj|pg)/.*(chat/completions|completions|embeddings|generate|images) {
        proxy_pass http://127.0.0.1:4340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- 前端静态文件 ----------
    location / {
        root /opt/new-api/web/dist;
        index index.html;
        # 单页应用路由回退
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（带 hash 的构建产物）
    location /static/ {
        root /opt/new-api/web/dist;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}
